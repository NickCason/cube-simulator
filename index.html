<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#dcd9d5" />
    <title>Cube Simulator</title>
    <meta name="description" content="A hyper-real, physically simulated jelly cube you can poke, throw, slice, nail, torch, freeze, scoop and blow up." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="Cube Simulator" />
    <meta property="og:description" content="Poke, throw, slice, nail, torch, freeze, scoop and blow up a physically simulated jelly cube. Then re-cube it." />
    <meta property="og:type" content="website" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cube" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // The look (studio or glow mode), and the opening splash (skipped for
      // screenshots and automation), lit in the jelly's saved flavour.
      (function () {
        var q = location.search, d = document.documentElement;
        // glow mode (dark), before anything paints
        try {
          var th = (q.match(/[?&]theme=(dark|light)\b/) || [])[1] || localStorage.getItem('cube-sim-theme');
          if (th === 'dark') {
            d.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#050507');
          }
        } catch (e) {}
        if (/[?&](shot|nosplash)\b/.test(q) || (navigator.webdriver && !/[?&]splash\b/.test(q))) return;
        d.classList.add('splashing');
        try {
          var st = JSON.parse(localStorage.getItem('cube-sim-style') || '{}') || {};
          var F = { cherry: '#d4102a', lime: '#5fce1e', blue: '#0f8cff', grape: '#7a24d4', orange: '#ff7414', lemon: '#ffcc12', watermelon: '#ff3f7f', cola: '#7a2e0e' };
          var f = st.flavor, L = st.layers && st.layers.colors;
          var c = F[f] || (/^#[0-9a-f]{6}$/i.test(f) ? f : (f === 'layers' || f === 'rainbow') && L && L.length ? L[L.length - 1] : null);
          if (c) d.style.setProperty('--jelly', c);
        } catch (e) {}
      })();
    </script>
    <style>
      /* the splash, styled before anything else loads */
      #splash {
        display: none;
      }
      html.splashing {
        background: #030304;
      }
      .splashing #splash,
      #splash.on {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        pointer-events: none;
        overflow: hidden;
        --jl: var(--jelly, #d4102a);
      }
      .sp-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 42%, #121014 0%, #070608 55%, #030304 100%);
      }
      .sp-stage {
        position: relative;
        display: grid;
        justify-items: center;
        gap: min(6vh, 9vw);
        transform: translateY(-3vh);
      }
      .sp-hero {
        position: relative;
        display: grid;
        place-items: center;
      }
      .sp-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(130vw, 95vh);
        height: min(130vw, 95vh);
        margin: calc(min(130vw, 95vh) / -2) 0 0 calc(min(130vw, 95vh) / -2);
        border-radius: 50%;
        background: radial-gradient(closest-side, #ff8a95 0%, var(--jl) 22%, rgba(212, 16, 42, 0.4) 46%, transparent 72%);
        background: radial-gradient(closest-side, color-mix(in srgb, var(--jl) 75%, #fff) 0%, var(--jl) 22%, color-mix(in srgb, var(--jl) 40%, transparent) 46%, transparent 72%);
        opacity: 0;
        animation: sp-glow 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
      }
      .sp-glow.flare {
        animation: sp-flare 1.5s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .sp-cube,
      .sp-rim {
        position: relative;
        grid-area: 1 / 1;
        width: min(40vw, 28vh);
        overflow: visible;
      }
      .sp-cube {
        opacity: 0;
        transform-origin: 50% 92%;
        animation: sp-rise 1.15s ease 0.05s forwards;
      }
      .sp-cube .f1 {
        fill: #0c0b0d;
      }
      .sp-cube .f2 {
        fill: #070608;
      }
      .sp-cube .f3 {
        fill: #040405;
      }
      .sp-cube path {
        stroke: #050506;
        stroke-width: 0.6;
        stroke-linejoin: round;
      }
      .sp-rim {
        opacity: 0;
        filter: drop-shadow(0 0 2px var(--jl)) drop-shadow(0 0 6px var(--jl));
        transform-origin: 50% 92%;
        animation: sp-light 1.2s ease forwards;
      }
      .sp-rim path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sp-rim .rim {
        stroke: #ff7d8a;
        stroke: color-mix(in srgb, var(--jl) 55%, #fff);
        stroke-width: 0.9;
      }
      .sp-rim .edge {
        stroke: #ff8a95;
        stroke: color-mix(in srgb, var(--jl) 45%, #fff);
        stroke-width: 0.5;
        opacity: 0.5;
      }
      .sp-word {
        position: relative;
        width: min(74vw, 50vh);
        aspect-ratio: 146 / 60;
        transform-origin: 50% 50%;
      }
      .sp-word svg {
        position: absolute;
        display: block;
        overflow: visible;
      }
      .sp-word .l {
        top: 0;
        height: 66.67%;
        opacity: 0;
        transform-origin: 50% 100%;
        animation: sp-letter 1.05s ease forwards;
      }
      .sp-word .l:nth-of-type(1) {
        animation-delay: 0.28s;
      }
      .sp-word .l:nth-of-type(2) {
        animation-delay: 0.4s;
      }
      .sp-word .l:nth-of-type(3) {
        animation-delay: 0.52s;
      }
      .sp-word .l:nth-of-type(4) {
        animation-delay: 0.64s;
      }
      .sp-word .sim {
        left: 0;
        top: 66.67%;
        width: 100%;
        height: 33.33%;
        opacity: 0;
        animation: sp-sim 0.9s ease 1s forwards;
      }
      /* All is cube. Cube is all. - each word drops in after the name */
      .sp-tag {
        display: flex;
        gap: 0.5em;
        margin-top: calc(min(6vh, 9vw) * -0.55);
        font: 700 clamp(11px, 1.6vh, 14px) / 1 'SF Pro Display', 'SF Pro Text', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #f3efeb;
      }
      .sp-tag span {
        display: inline-block;
        opacity: 0;
        transform-origin: 50% 100%;
        animation: sp-letter 0.75s ease forwards;
      }
      .sp-tag .dot {
        color: var(--jl);
      }
      .sp-word use,
      .sp-word text {
        fill: #f3efeb;
      }
      .sp-word text {
        font: 600 13.2px 'SF Pro Display', 'SF Pro Text', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      @keyframes sp-glow {
        from {
          opacity: 0;
          transform: scale(0.55);
        }
        to {
          opacity: 0.2;
          transform: scale(0.85);
        }
      }
      @keyframes sp-flare {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        25% {
          opacity: 0.8;
        }
        to {
          opacity: 0.5;
          transform: none;
        }
      }
      /* gummy: everything lands like jelly - squash, overshoot, wobble to rest */
      @keyframes sp-rise {
        0% { opacity: 0; transform: translateY(-14%) scale(0.86, 1.14); }
        38% { opacity: 1; transform: translateY(0) scale(1.12, 0.86); }
        56% { transform: scale(0.94, 1.07); }
        72% { transform: scale(1.04, 0.97); }
        86% { transform: scale(0.99, 1.01); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes sp-light {
        0% { opacity: 0; transform: scale(0.94, 0.9); }
        28% { opacity: 1; transform: scale(1.07, 0.94); }
        50% { transform: scale(0.97, 1.04); }
        72% { transform: scale(1.015, 0.99); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes sp-letter {
        0% { opacity: 0; transform: translateY(-80%) scale(0.72, 1.38); }
        28% { opacity: 1; transform: translateY(0) scale(1.32, 0.66); }
        44% { transform: translateY(-16%) scale(0.85, 1.2); }
        60% { transform: translateY(0) scale(1.12, 0.9); }
        74% { transform: translateY(-4%) scale(0.96, 1.04); }
        87% { transform: translateY(0) scale(1.02, 0.98); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes sp-sim {
        0% { opacity: 0; transform: scale(1.55, 0.5); }
        38% { opacity: 0.62; transform: scale(0.9, 1.18); }
        58% { transform: scale(1.05, 0.94); }
        78% { transform: scale(0.98, 1.02); }
        100% { opacity: 0.62; transform: none; }
      }
      /* the reveal waits for the app to have booted (src/ui/splash.js: go):
         booting stalls the page, and these must run smoothly */
      .sp-glow.flare,
      .sp-rim,
      .sp-word .l,
      .sp-word .sim,
      .sp-tag span {
        animation-play-state: paused;
      }
      #splash.go .sp-glow.flare,
      #splash.go .sp-rim,
      #splash.go .sp-word .l,
      #splash.go .sp-word .sim,
      #splash.go .sp-tag span {
        animation-play-state: running;
      }
      /* leaving: the dark falls away, the cube's silhouette flies past, the
         name settles into the logotype at the top (see src/ui/splash.js) */
      #splash.out .sp-bg {
        opacity: 0;
        transition: opacity 0.9s ease 0.1s;
      }
      #splash.out .sp-hero {
        opacity: 0;
        transform: scale(1.7);
        transition: transform 0.7s cubic-bezier(0.55, 0, 0.75, 0.2), opacity 0.4s ease 0.12s;
      }
      #splash.out .sp-word {
        /* (a little wind-up, then it springs up into the logotype) */
        transition: transform 0.9s cubic-bezier(0.55, -0.3, 0.3, 1.32);
      }
      #splash.out .sp-tag {
        opacity: 0;
        transform: scale(1.3, 0.6);
        transition: opacity 0.25s ease, transform 0.35s ease;
      }
      #splash.out .sp-word use,
      #splash.out .sp-word text {
        fill: #1c1c1f;
        transition: fill 0.6s ease 0.25s;
      }
      #splash.gone .sp-word {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      #splash.out-fast {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- the logotype's letters and mark (used by the splash and the header) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <path id="bl-c" d="M35.32 7.14A20 20 0 1 0 35.32 32.86L27.66 26.43A10 10 0 1 1 27.66 13.57Z" />
        <path id="bl-u" d="M39 2.5A2.5 2.5 0 0 1 41.5 0H46.5A2.5 2.5 0 0 1 49 2.5V22A8 8 0 0 0 65 22V2.5A2.5 2.5 0 0 1 67.5 0H72.5A2.5 2.5 0 0 1 75 2.5V22A18 18 0 0 1 39 22Z" />
        <path id="bl-b" fill-rule="evenodd" d="M82.5 0H100.5A9.5 9.5 0 0 1 100.5 19H102.5A10.5 10.5 0 0 1 102.5 40H82.5A2.5 2.5 0 0 1 80 37.5V2.5A2.5 2.5 0 0 1 82.5 0ZM90 8V15H98A3.5 3.5 0 0 0 98 8ZM90 23V32H100A4.5 4.5 0 0 0 100 23Z" />
        <path id="bl-e" d="M120.5 0H146V8H128V16H143V24H128V32H146V40H120.5A2.5 2.5 0 0 1 118 37.5V2.5A2.5 2.5 0 0 1 120.5 0Z" />
      </defs>
    </svg>
    <div id="splash" aria-hidden="true">
      <div class="sp-bg"></div>
      <div class="sp-stage">
        <div class="sp-hero">
          <div class="sp-glow"></div>
          <div class="sp-glow flare"></div>
          <svg class="sp-cube" viewBox="0 0 64 64">
            <path class="f1" d="M32 6 56 18 32 30 8 18Z" />
            <path class="f2" d="M8 18 32 30V58L8 46Z" />
            <path class="f3" d="M56 18 32 30V58L56 46Z" />
          </svg>
          <svg class="sp-rim" viewBox="0 0 64 64">
            <path class="edge" d="M8 18 32 30 56 18M32 30V58" />
            <path class="rim" d="M32 58 8 46V18L32 6 56 18V46Z" />
          </svg>
        </div>
        <!-- laid out exactly as the logotype's word (viewBox 0 0 146 60), so it can settle onto it -->
        <div class="sp-word">
          <svg class="l" style="left: 0; width: 24.66%" viewBox="0 0 36 40"><use href="#bl-c" /></svg>
          <svg class="l" style="left: 26.71%; width: 24.66%" viewBox="39 0 36 40"><use href="#bl-u" /></svg>
          <svg class="l" style="left: 54.79%; width: 22.6%" viewBox="80 0 33 40"><use href="#bl-b" /></svg>
          <svg class="l" style="left: 80.82%; width: 19.18%" viewBox="118 0 28 40"><use href="#bl-e" /></svg>
          <svg class="sim" viewBox="0 40 146 20"><text x="0" y="58" textLength="146" lengthAdjust="spacing">SIMULATOR</text></svg>
        </div>
        <div class="sp-tag"><span style="animation-delay: 1.12s">All</span><span style="animation-delay: 1.18s">is</span><span style="animation-delay: 1.24s">cube</span><span class="dot" style="animation-delay: 1.31s">·</span><span style="animation-delay: 1.38s">Cube</span><span style="animation-delay: 1.44s">is</span><span style="animation-delay: 1.5s">all</span></div>
      </div>
    </div>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
